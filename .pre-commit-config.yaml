# Pre-commit hooks for media-search-agent.
#
# Activate locally:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against the working tree:
#   pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: check-doc-separation
        name: Public docs must not link into internal/
        entry: python scripts/check_doc_separation.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-ps1-ascii
        name: .ps1 files must be ASCII + LF (PowerShell 5.1 compatibility)
        entry: python scripts/check_ps1_ascii.py
        language: system
        files: \.ps1$
        pass_filenames: true
