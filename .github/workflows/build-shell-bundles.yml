name: Build Shell Bundles

# Manually triggered workflow to build the one-liner installer bundles for all
# three platforms. Use this to test bundles before cutting a release, or to
# produce bundles for a specific version without publishing a GitHub Release.
#
# Usage:
#   1. Actions → Build Shell Bundles → Run workflow
#   2. Enter a version string (e.g. 0.2.0-rc1 or 0.2.0-test)
#   3. Download the .tar.gz / .zip artifacts from the completed run
#   4. Test locally:
#      macOS/Linux:  bash install.sh --bundle <downloaded.tar.gz>
#      Windows:      powershell -File install.ps1 -Bundle <downloaded.zip>

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version string (e.g. 0.2.0-rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── React UI (built once, shared across all bundle jobs) ─────────────────────
  build-ui:
    name: Build React UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/msa_apps/ui/package-lock.json

      - run: npm ci --prefix src/msa_apps/ui
      - run: npm run build --prefix src/msa_apps/ui

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/msa_apps/ui/dist
          if-no-files-found: error
          retention-days: 1

  # ── macOS bundle (arm64) — requires macOS runner for hdiutil / lipo / brew ───
  build-macos-bundle:
    name: Build macOS Bundle (arm64)
    runs-on: macos-14
    timeout-minutes: 30
    needs: build-ui
    steps:
      - uses: actions/checkout@v4

      - name: Download React UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/msa_apps/ui/dist

      - name: Build macOS arm64 bundle
        run: |
          bash installer/macos/shell/build-bundle.sh \
            --version "${{ inputs.version }}" \
            --platform macos

      - uses: actions/upload-artifact@v4
        with:
          name: macos-shell-bundle
          path: dist/shell/MediaSearchAgent-*-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ── Linux bundle (x86_64) ────────────────────────────────────────────────────
  build-linux-bundle:
    name: Build Linux Bundle (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-ui
    steps:
      - uses: actions/checkout@v4

      - name: Download React UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/msa_apps/ui/dist

      - name: Build Linux x86_64 bundle
        run: |
          bash installer/macos/shell/build-bundle.sh \
            --version "${{ inputs.version }}" \
            --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-shell-bundle
          path: dist/shell/MediaSearchAgent-*-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ── Windows bundle (x86_64) — build on Windows so the tray app has native .NET ─
  build-windows-bundle:
    name: Build Windows Bundle (x86_64)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build-ui
    steps:
      - uses: actions/checkout@v4

      - name: Download React UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/msa_apps/ui/dist

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # build-bundle.sh's final step calls `zip`, which isn't on windows-latest
      # Git Bash by default. See release.yml for the matching step.
      - name: Install zip (for build-bundle.sh)
        run: choco install zip --no-progress -y
        shell: powershell

      - name: Build Windows x86_64 bundle
        shell: bash
        run: |
          bash installer/windows-native/shell/build-bundle.sh \
            --version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shell-bundle
          path: dist/shell/MediaSearchAgent-*-windows-*.zip
          if-no-files-found: error
          retention-days: 1

  # ── Summary ───────────────────────────────────────────────────────────────────
  summary:
    name: Bundle Summary
    runs-on: ubuntu-latest
    needs: [build-macos-bundle, build-linux-bundle, build-windows-bundle]
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "*-shell-bundle"
          path: dist/shell
          merge-multiple: true

      - name: Print bundle sizes and names
        run: |
          echo ""
          echo "=== Shell Bundles — v${{ inputs.version }} ==="
          ls -lh dist/shell/
          echo ""
          echo "Test macOS/Linux:"
          echo "  bash install.sh --bundle <filename>.tar.gz --skip-autostart"
          echo ""
          echo "Test Windows:"
          echo "  powershell -File install.ps1 -Bundle <filename>.zip -SkipAutoStart"
          echo ""
