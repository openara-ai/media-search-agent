name: Test macOS Shell Installer

# Builds the macOS arm64 shell bundle from the current branch, installs it,
# runs a post-install smoke test, exercises `msa uninstall`, and uploads the
# full install log as an artifact so failures can be diagnosed.
#
# Triggers:
#   - workflow_dispatch   — run manually at any time
#   - pull_request        — when installer or build-script files change

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/macos/shell/**"
      - "installer/macos/build-bundle.sh"
      - "installer/macos/config.macos.yaml.template"
      - "scripts/start.sh"
      - "scripts/stop.sh"
      - "scripts/lib/**"

permissions:
  contents: read

jobs:
  test-macos-shell-installer:
    name: macOS Shell Installer (arm64)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build React UI ──────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/msa_apps/ui/package-lock.json

      - name: Build React UI
        run: |
          npm ci --prefix src/msa_apps/ui
          npm run build --prefix src/msa_apps/ui

      # ── Build the macOS shell bundle ────────────────────────────────────────
      - name: Build macOS arm64 bundle
        run: |
          bash installer/macos/shell/build-bundle.sh \
            --version ci-test \
            --platform macos
          echo "BUNDLE=$(ls dist/shell/MediaSearchAgent-*-macos-*.tar.gz | head -1)" >> "$GITHUB_ENV"

      - name: Show bundle size and contents
        run: |
          ls -lh "$BUNDLE"
          tar -tzf "$BUNDLE" | sort

      # ── Install ──────────────────────────────────────────────────────────────
      - name: Run installer
        run: |
          mkdir -p /tmp/msa-install-log
          bash installer/macos/shell/install.sh \
            --bundle "$BUNDLE" \
            --skip-autostart \
            2>&1 | tee /tmp/msa-install-log/install.log

      # ── Post-install smoke tests ─────────────────────────────────────────────
      - name: Verify launcher exists and is executable
        run: |
          test -x "$HOME/.local/bin/msa" || \
            { echo "FAIL: launcher missing or not executable"; exit 1; }
          echo "PASS: launcher at $HOME/.local/bin/msa"

      - name: Verify venv was created
        run: |
          VENV="$HOME/Applications/MediaSearchAgent.app/Contents/Resources/.venv"
          test -d "$VENV" || { echo "FAIL: venv not found at $VENV"; exit 1; }
          test -x "$VENV/bin/python" || { echo "FAIL: venv python missing"; exit 1; }
          echo "PASS: venv at $VENV"

      - name: Verify config.yaml was seeded
        run: |
          CONFIG="$HOME/Library/Application Support/MediaSearchAgent/config.yaml"
          test -f "$CONFIG" || { echo "FAIL: config.yaml not found"; exit 1; }
          grep -q "port" "$CONFIG" || { echo "FAIL: config.yaml looks empty"; exit 1; }
          echo "PASS: config.yaml at $CONFIG"

      - name: Verify uv is app-private (not ~/.local/bin/uv)
        run: |
          APP_CODE_DIR="$HOME/Applications/MediaSearchAgent.app/Contents/Resources"
          test -x "$APP_CODE_DIR/bin/uv" || \
            { echo "FAIL: app-private uv missing at $APP_CODE_DIR/bin/uv"; exit 1; }
          # uv must NOT have been copied to ~/.local/bin
          if test -f "$HOME/.local/bin/uv"; then
            echo "WARN: uv also present at ~/.local/bin/uv (may be pre-existing)"
          fi
          echo "PASS: uv at $APP_CODE_DIR/bin/uv"

      - name: Verify app code items installed
        run: |
          BASE="$HOME/Applications/MediaSearchAgent.app/Contents/Resources"
          for item in src scripts pyproject.toml requirements-api.txt bin/uv uninstall.sh; do
            test -e "$BASE/$item" || \
              { echo "FAIL: missing $BASE/$item"; exit 1; }
          done
          echo "PASS: all expected code items present"

      - name: Verify msa CLI responds
        run: |
          export PATH="$HOME/.local/bin:$HOME/Applications/MediaSearchAgent.app/Contents/Resources/bin:$PATH"
          msa --help 2>&1 | tee /tmp/msa-install-log/msa-help.log
          grep -qi "usage\|index\|api" /tmp/msa-install-log/msa-help.log || \
            { echo "FAIL: msa --help output looks wrong"; exit 1; }
          echo "PASS: msa --help returned expected output"

      - name: Verify msa api version responds
        run: |
          export PATH="$HOME/.local/bin:$HOME/Applications/MediaSearchAgent.app/Contents/Resources/bin:$PATH"
          msa --version 2>&1 | tee /tmp/msa-install-log/msa-version.log || true
          echo "PASS: msa --version ran (exit code may vary)"

      # ── Reinstall — index survives ────────────────────────────────────────────
      # Place a sentinel file in the index dir before reinstalling. The installer
      # must replace only code items (src/, scripts/, bin/, etc.) and leave any
      # existing data untouched.

      - name: Seed sentinel index file before reinstall
        run: |
          INDEX="$HOME/Library/Application Support/MediaSearchAgent/index"
          mkdir -p "$INDEX"
          echo "sentinel" > "$INDEX/sentinel.db"
          echo "Created sentinel at $INDEX/sentinel.db"

      - name: Reinstall over existing install
        run: |
          bash installer/macos/shell/install.sh \
            --bundle "$BUNDLE" \
            --skip-autostart \
            2>&1 | tee /tmp/msa-install-log/reinstall.log

      - name: Verify reinstall — launcher and venv still present
        run: |
          test -x "$HOME/.local/bin/msa" || \
            { echo "FAIL: launcher missing after reinstall"; exit 1; }
          VENV="$HOME/Applications/MediaSearchAgent.app/Contents/Resources/.venv"
          test -d "$VENV" || { echo "FAIL: venv missing after reinstall"; exit 1; }
          echo "PASS: launcher and venv present after reinstall"

      - name: Verify reinstall — sentinel index file survived
        run: |
          SENTINEL="$HOME/Library/Application Support/MediaSearchAgent/index/sentinel.db"
          test -f "$SENTINEL" || \
            { echo "FAIL: sentinel.db was wiped by reinstall (data-wipe bug)"; exit 1; }
          echo "PASS: sentinel.db preserved through reinstall"

      - name: Verify reinstall — config was not overwritten
        run: |
          CONFIG="$HOME/Library/Application Support/MediaSearchAgent/config.yaml"
          test -f "$CONFIG" || { echo "FAIL: config.yaml gone after reinstall"; exit 1; }
          grep -q "port" "$CONFIG" || { echo "FAIL: config.yaml empty after reinstall"; exit 1; }
          echo "PASS: config.yaml unchanged after reinstall"

      - name: Verify reinstall — msa CLI still responds
        run: |
          export PATH="$HOME/.local/bin:$HOME/Applications/MediaSearchAgent.app/Contents/Resources/bin:$PATH"
          msa --help 2>&1 | tee /tmp/msa-install-log/reinstall-msa-help.log
          grep -qi "usage\|index\|api" /tmp/msa-install-log/reinstall-msa-help.log || \
            { echo "FAIL: msa --help broken after reinstall"; exit 1; }
          echo "PASS: msa --help works after reinstall"

      # ── Uninstall ────────────────────────────────────────────────────────────
      # Two sub-scenarios:
      #   a) Full uninstall — answer 'y' to Tier 2 index/config/log prompts
      #   b) Re-run to confirm idempotency (already-uninstalled state → exits 0)

      - name: Uninstall — answer yes to all prompts (delete Tier 2 data)
        run: |
          # y = proceed; y/y/y = delete index, config, logs
          printf "y\ny\ny\ny\n" | \
            bash "$HOME/Applications/MediaSearchAgent.app/Contents/Resources/uninstall.sh" \
            2>&1 | tee /tmp/msa-install-log/uninstall-full.log
        env:
          NO_COLOR: "1"

      - name: Verify Tier 1 items are gone
        run: |
          FAIL=0
          test ! -f "$HOME/.local/bin/msa" || \
            { echo "FAIL: launcher still present"; FAIL=1; }
          test ! -d "$HOME/Applications/MediaSearchAgent.app" || \
            { echo "FAIL: app bundle still present"; FAIL=1; }
          test ! -d "$HOME/Applications/MediaSearchAgent.app/Contents/Resources/.venv" || \
            { echo "FAIL: venv still present"; FAIL=1; }
          test ! -d "$HOME/Applications/MediaSearchAgent.app/Contents/Resources/src" || \
            { echo "FAIL: src/ still present"; FAIL=1; }
          test ! -d "$HOME/Applications/MediaSearchAgent.app/Contents/Resources/bin" || \
            { echo "FAIL: bin/ still present"; FAIL=1; }
          [ "$FAIL" -eq 0 ] && echo "PASS: all Tier 1 items removed" || exit 1

      - name: Verify Tier 2 data deleted (answered yes to all prompts)
        run: |
          FAIL=0
          test ! -f "$HOME/Library/Application Support/MediaSearchAgent/index/sentinel.db" || \
            { echo "FAIL: sentinel.db still present despite answering y"; FAIL=1; }
          test ! -f "$HOME/Library/Application Support/MediaSearchAgent/config.yaml" || \
            { echo "FAIL: config.yaml still present despite answering y"; FAIL=1; }
          [ "$FAIL" -eq 0 ] && echo "PASS: Tier 2 data removed on request" || exit 1

      - name: Verify Tier 3 — ML model cache untouched
        run: |
          # CACHE_DIR exists only if models were downloaded; in CI it won't be present.
          # What matters is that the uninstaller never attempts to remove it.
          CACHE="$HOME/Library/Caches/MediaSearchAgent"
          if [[ -d "$CACHE" ]]; then
            echo "INFO: $CACHE exists (models present)"
          else
            echo "INFO: $CACHE absent (no models downloaded in CI — expected)"
          fi
          grep -i "Caches/MediaSearchAgent" /tmp/msa-install-log/uninstall-full.log | \
            grep -Eiv "not removed|tier 3|ml model cache:|to remove ml model caches|rm -rf" && \
            { echo "FAIL: uninstaller may have removed CACHE_DIR"; exit 1; } || true
          echo "PASS: ML model cache not touched by uninstaller"

      - name: Reinstall after full uninstall (verify clean-slate reinstall works)
        run: |
          bash installer/macos/shell/install.sh \
            --bundle "$BUNDLE" \
            --skip-autostart \
            2>&1 | tee /tmp/msa-install-log/reinstall-after-uninstall.log

      - name: Verify clean-slate reinstall — launcher and config present
        run: |
          test -x "$HOME/.local/bin/msa" || \
            { echo "FAIL: launcher missing after clean-slate reinstall"; exit 1; }
          test -f "$HOME/Library/Application Support/MediaSearchAgent/config.yaml" || \
            { echo "FAIL: config.yaml missing after clean-slate reinstall"; exit 1; }
          echo "PASS: clean-slate reinstall succeeded"

      # ── Upload logs ──────────────────────────────────────────────────────────
      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-shell-installer-logs
          path: /tmp/msa-install-log/
          retention-days: 7
