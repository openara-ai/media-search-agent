name: BVT

# On-demand real-media validation, dispatchable on ANY branch. Pick ONE suite per run so you
# only pay for what you're testing (the two suites are mutually exclusive - a desktop run never
# builds shell bundles, and vice versa):
#
#   suite: desktop       - the Tauri desktop app on macOS + Windows (.dmg / setup.exe): build
#                          each, then run the real-media desktop BVT against the installed app.
#   suite: shell-bundle  - the Linux shell bundle (.tar.gz): build it + run its install BVT, plus
#                          the dev-tools (dev-environment) real-media harness. macOS/Windows are
#                          desktop-app only; their shell bundles were retired.
#
# The release pipeline does NOT call this: release.yml validates each real-versioned
# release-candidate artifact in-place inside its own build job (the exact artifact that ships).
# Use THIS workflow for on-demand pre-merge validation on a feature branch.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which BVT suite to run (mutually exclusive)"
        required: true
        default: desktop
        type: choice
        options:
          - desktop        # macOS + Windows Tauri desktop app (.dmg / setup.exe)
          - shell-bundle   # Linux shell bundle + the dev-tools harness (macOS/Windows are desktop-only)
      include_slow_checks:
        description: "Run slow model-backed real-media checks (dev-tools job only; shell-bundle suite)"
        required: false
        default: true
        type: boolean
      upload_installer:
        description: "Upload the BVT-validated installer (.dmg / setup.exe) for manual testing (desktop suite only). Off by default so routine runs don't accumulate build artifacts."
        required: false
        default: false
        type: boolean

jobs:
  # ── React UI (built once for the Linux shell-bundle job) ─────────────────────
  build-ui:
    name: Build React UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the shell-bundle jobs consume this artifact (the desktop jobs build the SPA themselves
    # via tauri's beforeBuildCommand), so it runs only in the shell-bundle suite.
    if: ${{ inputs.suite == 'shell-bundle' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/msa_apps/ui/package-lock.json

      - run: npm ci --prefix src/msa_apps/ui
      - run: npm run build --prefix src/msa_apps/ui

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist-bvt
          path: src/msa_apps/ui/dist
          if-no-files-found: error
          retention-days: 1
  # ── Dev environment harness ───────────────────────────────────────────────────
  # Full integration: API + indexer + browser via run-local.sh.
  # Only meaningful when triggered manually (requires model downloads).
  # Not part of the release gate.
  dev-tools:
    name: Dev Tools — BVT (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.suite == 'shell-bundle' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Cache local model artifacts
        uses: actions/cache@v4
        with:
          path: |
            models/clip
            models/facenet_pytorch
            models/rtdetr
          key: ${{ runner.os }}-real-data-models-v3

      # BVT installs the dev environment exactly the way a developer would
      # (`bash scripts/dev-setup.sh`), via the same uv-based path the bundle
      # installer uses. The --bvt flag narrows scope: tools + Python env +
      # `pip install -e .` + pytest. Skips Node.js, UI build, git hooks.
      # See scripts/dev-setup.sh for the canonical install logic.
      - name: Install dev environment (--bvt)
        run: bash scripts/dev-setup.sh --bvt

      - name: Preload model artifacts into repo-local cache
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD/src"
          python - <<'PY'
          from pathlib import Path
          from msa_indexer.models.embeddings import ClipEmbedder
          from msa_indexer.models.faces import FaceRecognizer
          from msa_indexer.models.objects import ObjectDetector
          model_root = Path("models")
          ClipEmbedder("ViT-L-14", "openai", "cpu", cache_dir=model_root)
          ObjectDetector(model_name="PekingU/rtdetr_r18vd", backend="rtdetr", device="cpu", model_dir=model_root)
          FaceRecognizer(backend="facenet_pytorch", model_name="vggface2", device="cpu", model_root=model_root)
          print("Model artifacts ready in", model_root.resolve())
          PY

      - name: Run real-data harness
        run: |
          if [[ "${{ github.event.inputs.include_slow_checks }}" == "true" ]]; then
            bash tests/real_media/run-local.sh --report-dir .artifacts/real-data --keep-workspace never
          else
            bash tests/real_media/run-local.sh --skip-slow-model-checks --report-dir .artifacts/real-data --keep-workspace never
          fi

      - name: Upload real-data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-report
          path: .artifacts/real-data/**
          if-no-files-found: warn
          retention-days: 1

  # ── Linux shell bundle ────────────────────────────────────────────────────────
  linux-bundle:
    name: Linux Bundle — BVT
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: build-ui
    if: ${{ inputs.suite == 'shell-bundle' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download React UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-bvt
          path: src/msa_apps/ui/dist

      - name: Cache bundle model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/msa-linux-home/.cache/MediaSearchAgent
          key: ${{ runner.os }}-bundle-models-v1

      - name: Build Linux bundle
        run: bash installer/macos/shell/build-bundle.sh --version 0.0.0-ci --platform linux

      - name: Validate Linux bundle install
        run: |
          BUNDLE=$(ls dist/shell/MediaSearchAgent-*-linux-x86_64.tar.gz)
          bash tests/real_media/scripts/validate-installed-bundle-linux.sh "$BUNDLE"

  # ── Tauri desktop app — macOS: build the shippable artifact + real-media desktop BVT ──────────
  # The go-forward validation path. Builds the desktop .dmg the SAME way release.yml does
  # (stage-desktop-backend.sh → npx tauri build), then runs the real-media BVT against the
  # installed .app — a HARD gate here (unlike release.yml's continue-on-error), because the whole
  # point of dispatching this workflow on a branch is a real pass/fail signal. Self-contained: no
  # build-ui dependency (tauri's beforeBuildCommand builds the SPA). Non-publish build — the
  # committed tauri.conf createUpdaterArtifacts:false means no signing key is needed.
  desktop-macos:
    name: Desktop BVT (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    if: ${{ inputs.suite == 'desktop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/msa_apps/ui/package-lock.json

      # Root npm ci installs the vendored @tauri-apps/cli (npx tauri); the SPA deps let tauri.conf's
      # beforeBuildCommand build the embedded frontend.
      - name: Install Tauri CLI (root) + SPA deps
        run: |
          npm ci
          npm ci --prefix src/msa_apps/ui

      - name: uv (pinned)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.21'

      - name: Stage desktop backend (uv + backend tree + tools + version stamp)
        shell: bash
        run: bash scripts/stage-desktop-backend.sh

      # Validation build: no updater artifacts (committed default), no signing key.
      - name: Build Tauri desktop bundle
        shell: bash
        run: npx tauri build

      - name: Cache desktop BVT model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/msa-desktop-home/Library/Caches/MediaSearchAgent
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-bvt-models-v1

      - name: Validate desktop install (real-media BVT)
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          bash tests/real_media/scripts/validate-installed-desktop-macos.sh "$DMG"

      # Opt-in (upload_installer=true) hand-off of the validated installer for manual testing — any
      # branch dispatch, no tag / no publish (release.yml's IS_PUBLISH path is untouched). Off by
      # default so routine BVT runs validate without accumulating build artifacts. success() keeps a
      # failed BVT from uploading, so a downloadable artifact only ever exists for a build that passed.
      - name: Upload validated .dmg (BVT passed)
        if: ${{ success() && inputs.upload_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ── Tauri desktop app — Windows: build the shippable setup.exe + real-media desktop BVT ───────
  # See desktop-macos. Git Bash runs the bash steps on windows-latest. The BVT UI-launches the
  # installed app (CI: discovers the ephemeral port from msa-desktop.log, runs the runtime
  # suite, quits + asserts no orphan sidecar) — the go-forward replacement for the legacy Windows
  # shell-bundle BVT, and the way to get REAL Windows validation from a Mac dev box.
  desktop-windows:
    name: Desktop BVT (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    if: ${{ inputs.suite == 'desktop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/msa_apps/ui/package-lock.json

      - name: Install Tauri CLI (root) + SPA deps
        run: |
          npm ci
          npm ci --prefix src/msa_apps/ui

      - name: uv (pinned)
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.21'

      - name: Stage desktop backend (uv + backend tree + tools + version stamp)
        shell: bash
        run: bash scripts/stage-desktop-backend.sh

      - name: Build Tauri desktop bundle
        shell: bash
        run: npx tauri build

      - name: Validate desktop install (real-media BVT, CI)
        shell: powershell
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          & powershell -ExecutionPolicy Bypass -File tests/real_media/scripts/validate-installed-desktop-windows.ps1 -Ci -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Opt-in (upload_installer=true) hand-off of the validated installer for manual testing — any
      # branch dispatch, no tag / no publish (release.yml's IS_PUBLISH path is untouched). Off by
      # default so routine BVT runs validate without accumulating build artifacts. success() keeps a
      # failed BVT from uploading, so a downloadable artifact only ever exists for a build that passed.
      - name: Upload validated setup.exe (BVT passed)
        if: ${{ success() && inputs.upload_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-setup-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
